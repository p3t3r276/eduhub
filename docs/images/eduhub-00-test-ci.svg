<text x="40" y="42" font-size="22" font-weight="700" fill="#222">EduHub · Test &amp; CI (sau Ngày 28)</text>
<text x="40" y="64" font-size="13" fill="#555">Mỗi công cụ nối tới phần nó kiểm tra. Test HTTP đi qua MSW thật thay vì mock service, nên interceptor, serialization và scenario lỗi đều được kiểm tra.</text>
